<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Gallery - Fresh & Delicious</title>
    <link rel="stylesheet" href="food-gallery.css">
</head>
<body>
    <header>
        <div class="header-content">
            <div class="food-topline">
                <a class="food-brand" href="index.html">Table &amp; Tide</a>
                <nav class="page-links">
                    <a class="back-link" href="index.html" data-i18n="shopObjects">Shop objects <span aria-hidden="true">&larr;</span></a>
                    <a href="about-us.html" data-i18n="about">About</a>
                    <a href="contact-us.html" data-i18n="contact">Contact</a>
                </nav>
                <label class="language-switcher"><span class="sr-only">Language</span><select data-language aria-label="Language"><option value="en">English</option><option value="mr">मराठी</option></select></label>
            </div>
            <p class="eyebrow" data-i18n="hungry">A little hungry?</p>
            <h1>Good food,<br><em>no small talk.</em></h1>
            <p data-i18n="menuIntro">Browse the menu, choose your mood, and let dinner take it from there.</p>
        </div>
    </header>

    <nav class="filter-nav">
        <button class="filter-btn active" data-filter="all" data-i18n="all">All</button>
        <button class="filter-btn" data-filter="savory" data-i18n="savory">Savory</button>
        <button class="filter-btn" data-filter="fresh" data-i18n="fresh">Fresh</button>
        <button class="filter-btn" data-filter="sweet" data-i18n="sweet">Sweet</button>
    </nav>

    <div class="gallery-container">
        <div class="product-grid" id="productGrid">
            <!-- Products will be loaded here -->
        </div>
    </div>

    <div class="cart-sidebar" id="cartSidebar">
        <div class="cart-header">
            <h2 data-i18n="yourCart">🛒 Your Cart</h2>
            <button class="close-cart" id="closeCart">&times;</button>
        </div>
        <div class="cart-items" id="cartItems">
            <!-- Cart items will be loaded here -->
        </div>
        <div class="cart-footer">
            <div class="cart-total">
                <span data-i18n="total">Total:</span>
                <span id="cartTotal">$0.00</span>
            </div>
            <button class="checkout-btn" id="checkoutBtn" data-i18n="checkout">Checkout</button>
        </div>
    </div>

    <button class="cart-toggle" id="cartToggle" aria-label="Open shopping cart">
        <span aria-hidden="true" data-i18n="cart">Cart</span><b id="cartCount">0</b>
    </button>

    <div class="modal" id="productModal">
        <div class="modal-content">
            <span class="modal-close" id="closeModal">&times;</span>
            <img src="" alt="" id="modalImage">
            <div class="modal-info">
                <h2 id="modalTitle">Product Name</h2>
                <p id="modalDescription">Description</p>
                <p class="modal-price" id="modalPrice">$0.00</p>
                <button class="add-to-cart-modal" id="addModalToCart">Add to Cart</button>
            </div>
        </div>
    </div>

    <script src="food-gallery.js"></script>
    <script src="language.js"></script>
</body>
</html>
